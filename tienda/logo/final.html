<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Italiana&family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:transparent}
  .art{display:flex;align-items:center;justify-content:center}
  .cream{background:#f6f1ea}.ink{background:#1c1a17}.clear{background:transparent}
  .col{display:flex;flex-direction:column;align-items:center}
  .row{display:flex;align-items:center}
  .thin{font-family:'Italiana';line-height:1}
  .small{font-family:Jost;font-weight:300;color:#b08d57}
  .d{color:#1c1a17}.l{color:#f6f1ea}
</style></head><body>

<template id="mark">
  <svg viewBox="0 0 420 360">
    <ellipse cx="210" cy="180" rx="190" ry="160" fill="none" stroke="#b08d57" stroke-width="WIDTH"/>
    <text x="140" y="250" text-anchor="middle" font-family="Pinyon Script" font-size="260" fill="INK">I</text>
    <text x="265" y="250" text-anchor="middle" font-family="Pinyon Script" font-size="260" fill="INK">O</text>
  </svg>
</template>

<!-- 1. Principal vertical, fondo crema -->
<div class="art cream" id="logo-principal" style="width:1600px;height:1600px">
  <div class="col">
    <div class="m" data-ink="#1c1a17" data-w="1.4" style="width:640px;height:549px;margin-bottom:50px"></div>
    <div class="thin d" style="font-size:118px;letter-spacing:34px;padding-left:34px">INÉS OLMEDO</div>
    <div class="small" style="font-size:36px;letter-spacing:22px;padding-left:22px;margin-top:40px">ATELIER · MADRID</div>
  </div>
</div>

<!-- 2. Cabecera horizontal transparente, negro -->
<div class="art clear" id="cabecera-negro" style="width:2000px;height:420px">
  <div class="row" style="gap:60px">
    <div class="m" data-ink="#1c1a17" data-w="2" style="width:380px;height:326px"></div>
    <div class="col" style="align-items:flex-start">
      <div class="thin d" style="font-size:128px;letter-spacing:30px">INÉS OLMEDO</div>
      <div class="small" style="font-size:34px;letter-spacing:20px;margin-top:30px">ATELIER · MADRID</div>
    </div>
  </div>
</div>

<!-- 3. Cabecera horizontal transparente, blanco -->
<div class="art clear" id="cabecera-blanco" style="width:2000px;height:420px">
  <div class="row" style="gap:60px">
    <div class="m" data-ink="#f6f1ea" data-w="2" style="width:380px;height:326px"></div>
    <div class="col" style="align-items:flex-start">
      <div class="thin l" style="font-size:128px;letter-spacing:30px">INÉS OLMEDO</div>
      <div class="small" style="font-size:34px;letter-spacing:20px;margin-top:30px">ATELIER · MADRID</div>
    </div>
  </div>
</div>

<!-- 4. Vertical transparente negro -->
<div class="art clear" id="vertical-negro" style="width:1400px;height:1100px">
  <div class="col">
    <div class="m" data-ink="#1c1a17" data-w="1.6" style="width:560px;height:480px;margin-bottom:44px"></div>
    <div class="thin d" style="font-size:104px;letter-spacing:30px;padding-left:30px">INÉS OLMEDO</div>
    <div class="small" style="font-size:32px;letter-spacing:20px;padding-left:20px;margin-top:34px">ATELIER · MADRID</div>
  </div>
</div>

<!-- 5. Icono (favicon / perfil) crema -->
<div class="art cream" id="icono-crema" style="width:1080px;height:1080px">
  <div class="m" data-ink="#1c1a17" data-w="2.4" style="width:800px;height:686px"></div>
</div>

<!-- 6. Icono negro -->
<div class="art ink" id="icono-negro" style="width:1080px;height:1080px">
  <div class="m" data-ink="#f6f1ea" data-w="2.4" style="width:800px;height:686px"></div>
</div>

<!-- 7. Icono transparente -->
<div class="art clear" id="icono-transparente" style="width:1080px;height:1080px">
  <div class="m" data-ink="#1c1a17" data-w="2.4" style="width:800px;height:686px"></div>
</div>

<script>
  const t = document.getElementById('mark').innerHTML;
  document.querySelectorAll('.m').forEach(el => {
    el.innerHTML = t.replaceAll('INK', el.dataset.ink).replace('WIDTH', el.dataset.w);
    const s = el.querySelector('svg'); s.setAttribute('width','100%'); s.setAttribute('height','100%');
  });
</script>
</body></html>
